<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运绿茵 - 球员生涯模拟</title>
<style>
:root {
  --bg: #060c06; --bg2: #0d170d; --bg3: #111f11;
  --green: #3df04d; --green2: #22b82e; --green3: #5fff6e;
  --gold: #e6b843; --gold2: #ffe08a;
  --text: #e0e8e0; --text2: #9aaa9a; --text3: #f4faf4;
  --red: #ff5c4c; --border: #1e3a1e; --border2: #2e4a2e;
  --radius: 10px; --radius2: 6px;
  --font: 'Microsoft YaHei', 'PingFang SC', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh;
}
body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse at 50% 0%, rgba(46,204,64,0.04) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(212,168,67,0.03) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}
#app { position:relative; z-index:1; max-width:800px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

/* ---- 顶栏 ---- */
#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; background:var(--bg3); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100; gap:8px; flex-wrap:wrap;
}
#topbar .title { font-size:20px; font-weight:700; color:var(--green3); letter-spacing:2px; }
#topbar .info { font-size:14px; color:var(--text2); }
#topbar .info span { color:var(--gold); margin:0 4px; }
.top-btns { display:flex; gap:8px; }
.top-btn {
  padding:7px 14px; font-size:13px; background:var(--bg2); color:var(--text);
  border:1px solid var(--border2); border-radius:var(--radius2); cursor:pointer;
  transition:all 0.2s; font-family:var(--font); white-space:nowrap; font-weight:600;
}
.top-btn:hover { border-color:var(--green2); color:var(--green3); background:#162516; }

/* ---- 主区 ---- */
#main-area {
  flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px;
  max-height: calc(100vh - 180px);
}

/* 消息 */
.msg {
  max-width:85%; padding:14px 18px; border-radius:14px; line-height:1.8; font-size:16px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.system { align-self:center; background:transparent; color:var(--text2); font-size:14px; text-align:center; }
.msg.ai { align-self:flex-start; background:var(--bg2); border:1px solid var(--border2); color:var(--text3); }
.msg.player { align-self:flex-end; background:#0e2e16; border:1px solid var(--green2); color:var(--text3); }
.msg.news { align-self:flex-start; background:#221e0a; border:1px solid #4a4a1a; color:var(--gold2); font-size:15px; }
.msg.intro { align-self:center; color:var(--gold); font-size:16px; text-align:center; font-style:italic; }

/* 事件卡片 */
.event-card {
  background:var(--bg3); border:2px solid var(--border2); border-radius:var(--radius); padding:20px;
  animation: fadeIn 0.3s ease;
}
.event-card .cat { font-size:12px; color:var(--green3); letter-spacing:2px; margin-bottom:8px; font-weight:700; text-transform:uppercase; }
.event-card .tit { font-size:19px; font-weight:700; color:var(--text3); margin-bottom:10px; }
.event-card .desc { font-size:16px; color:var(--text); line-height:1.8; margin-bottom:16px; }
.event-card .opts { display:flex; flex-direction:column; gap:8px; }
.opt-btn {
  width:100%; text-align:left; padding:12px 16px; font-size:15px;
  background:var(--bg2); color:var(--text); border:1px solid var(--border2);
  border-radius:var(--radius2); cursor:pointer; transition:all 0.2s;
  font-family:var(--font); line-height:1.6; font-weight:500;
}
.opt-btn:hover { border-color:var(--green); color:var(--green3); background:#1a2e1a; }
.opt-btn .oid { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center;
  background:var(--green2); color:#fff; border-radius:50%; font-size:13px; font-weight:700; margin-right:10px; }
.opt-btn.custom { border-style:dashed; border-color:var(--text2); color:var(--text2); }
.opt-btn.custom:hover { border-color:var(--gold); color:var(--gold); }

/* 按钮行 */
.btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
.action-btn {
  padding:12px 28px; font-size:16px; font-weight:700; border:none; border-radius:24px;
  cursor:pointer; transition:all 0.2s; font-family:var(--font);
}
.btn-primary { background:var(--green2); color:#fff; }
.btn-primary:hover { background:var(--green); box-shadow:0 0 16px rgba(46,204,64,0.4); }
.btn-gold { background:transparent; color:var(--gold); border:2px solid var(--gold); }
.btn-gold:hover { background:rgba(230,184,67,0.12); }

/* 结算面板 */
.settle-panel {
  background:linear-gradient(180deg,#0a1a0a 0%,var(--bg3) 100%);
  border:2px solid var(--green2); border-radius:var(--radius); padding:24px;
}
.settle-panel .s-title { font-size:22px; font-weight:700; color:var(--gold); text-align:center; margin-bottom:20px; letter-spacing:2px; }
.settle-panel .s-section { margin-bottom:18px; }
.settle-panel .s-section h3 { font-size:15px; color:var(--green3); margin-bottom:8px; letter-spacing:1px;
  border-bottom:1px solid var(--border2); padding-bottom:6px; }
.settle-panel .s-text { font-size:16px; line-height:2; color:var(--text3); }
.settle-changes { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px; }
.change-item { font-size:14px; padding:6px 10px; border-radius:var(--radius2); background:var(--bg2); font-weight:500; }
.change-item.pos { color:var(--green3); border-left:3px solid var(--green); }
.change-item.neg { color:var(--red); border-left:3px solid var(--red); }

/* ---- 底部 ---- */
#input-area {
  padding:12px 20px; background:var(--bg3); border-top:2px solid var(--border);
  display:flex; gap:10px; align-items:center; position:sticky; bottom:0; z-index:100;
}
#msg-input {
  flex:1; padding:11px 16px; background:var(--bg2); color:var(--text3);
  border:1px solid var(--border2); border-radius:24px; font-size:16px;
  font-family:var(--font); outline:none; transition:border-color 0.2s;
}
#msg-input:focus { border-color:var(--green); }
#msg-input::placeholder { color:var(--text2); }
#send-btn {
  padding:11px 22px; background:var(--green2); color:#fff; border:none;
  border-radius:24px; font-size:15px; cursor:pointer; font-family:var(--font); font-weight:700;
}
#send-btn:hover { background:var(--green); }
#settle-btn {
  padding:11px 22px; background:transparent; color:var(--gold);
  border:2px solid var(--gold); border-radius:24px; font-size:14px; cursor:pointer; font-family:var(--font); font-weight:600;
}
#settle-btn:hover { background:rgba(230,184,67,0.12); }

/* ---- 模态 ---- */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200;
  display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s;
}
.modal-panel {
  background:var(--bg3); border:2px solid var(--border2); border-radius:14px;
  padding:24px 28px; max-width:600px; width:92%; max-height:88vh; overflow-y:auto;
  animation:slideUp 0.3s;
}
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal-panel h2 { font-size:22px; color:var(--gold); margin-bottom:20px; letter-spacing:2px; text-align:center; }
.modal-close { float:right; background:none; border:none; color:var(--text2); font-size:24px; cursor:pointer; }
.modal-close:hover { color:var(--red); }

.attr-sect { margin-bottom:18px; }
.attr-sect h3 { font-size:15px; color:var(--green3); margin-bottom:10px; letter-spacing:1px;
  border-bottom:1px solid var(--border2); padding-bottom:6px; }
.attr-row { display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:15px; }
.attr-name { width:80px; color:var(--text); font-weight:500; }
.attr-bar-wrap { flex:1; height:8px; background:var(--bg); border-radius:4px; margin:0 12px; overflow:hidden; }
.attr-bar { height:100%; border-radius:4px; transition:width 0.5s; }
.attr-bar.hard { background:linear-gradient(90deg,var(--green2),var(--green3)); }
.attr-bar.soft { background:linear-gradient(90deg,#1a6aaa,#3d9df0); }
.attr-val { width:32px; text-align:right; font-family:monospace; font-size:14px; color:var(--text); font-weight:600; }
.attr-sum { text-align:center; font-size:13px; color:var(--text2); margin-top:8px; padding-top:8px; border-top:1px solid var(--border2); }

.team-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.team-stat { background:var(--bg2); padding:16px; border-radius:var(--radius2); text-align:center; }
.team-stat .l { font-size:13px; color:var(--text2); margin-bottom:6px; }
.team-stat .v { font-size:26px; font-weight:700; color:var(--gold); font-family:monospace; }

.news-list { list-style:none; }
.news-list li { padding:10px 0; border-bottom:1px solid var(--border2); font-size:15px; line-height:1.7; color:var(--text); cursor:pointer; transition:all 0.2s; }
.news-list li:hover { color:var(--gold); }
.news-list li .news-short { }
.news-list li.open .news-short { display:none; }
.news-list li .news-detail { display:none; margin-top:6px; padding:8px 12px; background:var(--bg2); border-radius:6px; font-size:14px; color:var(--text3); line-height:1.9; }
.news-list li.open .news-detail { display:block; }
.news-list li .news-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; margin-right:6px; }
.news-list li .news-tag.league { background:rgba(46,204,64,0.15); color:var(--green3); }
.news-list li .news-tag.world { background:rgba(61,157,240,0.15); color:#3d9df0; }
.news-list li .news-tag.personal { background:rgba(230,184,67,0.15); color:var(--gold); }

/* ---- 创建页 ---- */
#create-wrap { max-width:500px; margin:40px auto; padding:36px; }
#create-wrap h1 { text-align:center; font-size:34px; color:var(--green3); letter-spacing:4px; margin-bottom:10px; }
#create-wrap .sub { text-align:center; color:var(--text2); font-size:15px; margin-bottom:32px; }
.fg { margin-bottom:16px; }
.fg label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; letter-spacing:1px; font-weight:600; }
.fg input, .fg select {
  width:100%; padding:11px 14px; background:var(--bg2); color:var(--text3);
  border:1px solid var(--border2); border-radius:var(--radius2); font-size:16px;
  font-family:var(--font); outline:none; transition:border-color 0.2s;
}
.fg input:focus, .fg select:focus { border-color:var(--green); }
.fg-row { display:flex; gap:10px; }
.fg-row .fg { flex:1; }

/* 特点选择器 */
.trait-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.trait-grid select {
  width:100%; padding:10px 12px; background:var(--bg2); color:var(--text3);
  border:1px solid var(--border2); border-radius:var(--radius2); font-size:14px;
  font-family:var(--font); outline:none; transition:border-color 0.2s;
}
.trait-grid select:focus { border-color:var(--green); }
.trait-grid select.has-pos { border-color:var(--green2); }
.trait-grid select.has-neg { border-color:var(--red); }
#trait-desc { font-size:12px; color:var(--text2); margin-top:6px; line-height:1.8; }
#trait-warn { font-size:11px; color:var(--red); margin-top:2px; }
#create-btn {
  width:100%; padding:14px; background:var(--green2); color:#fff; border:none;
  border-radius:var(--radius); font-size:18px; font-weight:700; cursor:pointer;
  letter-spacing:3px; transition:all 0.2s; font-family:var(--font); margin-top:8px;
}
#create-btn:hover { background:var(--green); box-shadow:0 0 24px rgba(46,204,64,0.4); }

.loading { display:inline-block; width:14px; height:14px; border:2px solid var(--border2);
  border-top-color:var(--green); border-radius:50%; animation:spin 0.6s linear infinite; margin-right:6px; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg)} }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* ---- 对话模态 ---- */
.talk-modal-content { max-width:500px; }
.talk-modal-content select {
  width:100%; padding:10px 14px; background:var(--bg2); color:var(--text3);
  border:1px solid var(--border2); border-radius:var(--radius2); font-size:15px;
  font-family:var(--font); outline:none; margin-bottom:12px;
}
.talk-modal-content select:focus { border-color:var(--green); }
.talk-msg-input {
  width:100%; padding:10px 14px; background:var(--bg2); color:var(--text3);
  border:1px solid var(--border2); border-radius:var(--radius2); font-size:15px;
  font-family:var(--font); outline:none; resize:vertical; min-height:80px; margin-bottom:12px;
}
.talk-msg-input:focus { border-color:var(--green); }
.talk-send-btn {
  width:100%; padding:10px; background:var(--green2); color:#fff; border:none;
  border-radius:var(--radius2); font-size:15px; font-weight:700; cursor:pointer;
  font-family:var(--font); transition:all 0.2s;
}
.talk-send-btn:hover { background:var(--green); }
.talk-send-btn:disabled { background:var(--border2); color:var(--text2); cursor:not-allowed; }

/* ---- 生涯面板 ---- */
.career-timeline { display:flex; flex-direction:column; gap:16px; }
.career-card {
  background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius);
  padding:18px; position:relative; overflow:hidden;
}
.career-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--green2),var(--gold));
}
.career-card .c-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.career-card .c-season { font-size:18px; font-weight:700; color:var(--gold); }
.career-card .c-club { font-size:14px; color:var(--text2); }
.career-card .c-stats { display:flex; gap:20px; margin-bottom:10px; flex-wrap:wrap; }
.career-card .c-stat { text-align:center; }
.career-card .c-stat .n { font-size:22px; font-weight:700; color:var(--text3); font-family:monospace; }
.career-card .c-stat .l { font-size:11px; color:var(--text2); letter-spacing:1px; }
.career-card .c-honors { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.career-card .c-honor {
  display:inline-block; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:600;
  background:rgba(230,184,67,0.15); color:var(--gold); border:1px solid rgba(230,184,67,0.3);
}
.career-card .c-honor.gold { background:rgba(230,184,67,0.25); color:#fff; border-color:var(--gold); }
.career-card .c-hl { font-size:13px; color:var(--text2); line-height:1.8; }
.career-card .c-hl summary { cursor:pointer; color:var(--text2); font-size:12px; letter-spacing:1px; }
.career-card .c-hl summary:hover { color:var(--green3); }
.career-card .c-attrs { font-size:12px; color:var(--text2); margin-top:8px; padding-top:8px; border-top:1px solid var(--border2); }
.career-summary { text-align:center; padding:12px; background:var(--bg2); border-radius:var(--radius2); margin-bottom:16px; }
.career-summary .cs-total { font-size:14px; color:var(--text2); }
.career-summary .cs-total b { color:var(--green3); margin:0 4px; }

/* ---- 存档选择 ---- */
.save-list { max-width:550px; margin:0 auto; }
.save-list h1 { text-align:center; font-size:34px; color:var(--green3); letter-spacing:4px; margin-bottom:8px; }
.save-list .sub { text-align:center; color:var(--text2); font-size:14px; margin-bottom:28px; }
.save-card {
  display:flex; align-items:center; gap:14px; background:var(--bg3); border:1px solid var(--border2);
  border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; transition:border-color 0.2s;
}
.save-card:hover { border-color:var(--green2); }
.save-card .s-avatar {
  width:48px; height:48px; border-radius:50%; background:var(--bg2); border:2px solid var(--green2);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
}
.save-card .s-info { flex:1; min-width:0; }
.save-card .s-name { font-size:17px; font-weight:700; color:var(--text3); }
.save-card .s-meta { font-size:13px; color:var(--text2); margin-top:3px; }
.save-card .s-meta span { color:var(--gold); margin:0 3px; }
.save-card .s-actions { display:flex; gap:6px; flex-shrink:0; }
.save-btn {
  padding:8px 16px; border-radius:var(--radius2); font-size:13px; font-weight:600;
  cursor:pointer; font-family:var(--font); border:none; transition:all 0.2s;
}
.save-btn.cont { background:var(--green2); color:#fff; }
.save-btn.cont:hover { background:var(--green); }
.save-btn.del { background:transparent; color:var(--red); border:1px solid var(--red); }
.save-btn.del:hover { background:rgba(255,92,76,0.12); }
.save-empty { text-align:center; padding:40px 20px; color:var(--text2); font-size:15px; line-height:2; }
.new-game-btn {
  display:block; width:100%; padding:14px; margin-top:20px;
  background:transparent; color:var(--gold); border:2px dashed var(--gold);
  border-radius:var(--radius); font-size:17px; font-weight:700; cursor:pointer;
  font-family:var(--font); letter-spacing:2px; transition:all 0.2s;
}
.new-game-btn:hover { background:rgba(230,184,67,0.08); border-style:solid; }
.back-menu-btn {
  background:none; border:1px solid var(--border2); color:var(--text2);
  padding:6px 12px; border-radius:var(--radius2); font-size:12px; cursor:pointer;
  font-family:var(--font); transition:all 0.2s;
}
.back-menu-btn:hover { border-color:var(--text2); color:var(--text); }

/* ---- 成就系统 ---- */
.ach-banner {
  position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:300;
  background:linear-gradient(135deg,#1a0a00,#3d2a00); border:2px solid var(--gold);
  border-radius:var(--radius); padding:12px 24px; display:flex; align-items:center; gap:12px;
  font-size:15px; color:var(--gold); font-weight:700; box-shadow:0 8px 32px rgba(230,184,67,0.3);
  animation: achSlide 0.4s ease, achFade 0.5s 3.5s ease;
  max-width:90vw;
}
@keyframes achSlide { from{opacity:0;transform:translateX(-50%) translateY(-20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
@keyframes achFade { to{opacity:0;transform:translateX(-50%) translateY(-20px)} }
.ach-banner .ach-icon { font-size:32px; }
.ach-banner .ach-text { line-height:1.4; }
.ach-banner .ach-text small { font-size:12px; opacity:0.7; display:block; }
.ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px; }
.ach-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius2);
  background:var(--bg2); border:1px solid var(--border2); font-size:14px; transition:all 0.3s; }
.ach-item.unlocked { border-color:var(--gold); background:rgba(230,184,67,0.08); }
.ach-item.locked { opacity:0.45; filter:grayscale(0.5); }
.ach-item .ach-icon { font-size:22px; flex-shrink:0; }
.ach-item .ach-info { flex:1; min-width:0; }
.ach-item .ach-info .ach-name { font-weight:600; color:var(--text3); font-size:14px; }
.ach-item .ach-info .ach-desc { font-size:11px; color:var(--text2); }
.ach-item.unlocked .ach-info .ach-name { color:var(--gold); }
.ach-cat { margin-bottom:16px; }
.ach-cat h3 { font-size:15px; color:var(--green3); margin-bottom:8px; letter-spacing:1px;
  border-bottom:1px solid var(--border2); padding-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.ach-cat h3 .ach-count { font-size:12px; color:var(--text2); font-weight:400; }

@media(max-width:600px) {
  #topbar { padding:8px 10px; }
  .top-btn { font-size:12px; padding:6px 10px; }
  #main-area { padding:10px; max-height:calc(100vh - 160px); }
  .msg { font-size:15px; max-width:94%; }
  .event-card .desc { font-size:15px; }
  .opt-btn { font-size:14px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
﻿const API = window.location.origin;
let pid = null;
let state = null;
let pendingOffers = [];
const HARD_ATTRS = ['射门','跑位','定位球','传球','盘带','技术','才华','盯人','抢断','站位','强壮','速度','跳跃','体力','头球'];

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail); }
  return r.json();
}

// 流式 SSE 请求 —— 返回 Promise，onChunk 逐 token 回调
function apiStream(path, body, onChunk) {
  return new Promise(async (resolve, reject) => {
    try {
      const r = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({ detail: r.statusText }));
        reject(new Error(e.detail)); return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const evt = JSON.parse(line.slice(6));
            if (evt.type === 'chunk') onChunk(evt.content);
            else if (evt.type === 'done') { resolve(evt); return; }
            else if (evt.type === 'error') { reject(new Error(evt.message)); return; }
          }
        }
      }
      reject(new Error('流意外结束'));
    } catch (e) { reject(e); }
  });
}

  addPlayer(`【自定义】${t}`);
  const phId = 's-' + Date.now();

  renderGame();
  try {

      `/api/game/${pid}/event_choice/stream`,
      { option_id: 'custom', custom_text: t },
      (chunk) => { const el = document.getElementById(phId); if (el) { el.textContent += chunk; scrollDown(); } }

function addSettle(data) {
  let chgHtml = '';
  // 合并事件变化 + 赛季成长
  const ch = data.attr_changes || {};
  const gr = data.growth_changes || {};
  const allKeys = new Set([...Object.keys(ch), ...Object.keys(gr)]);
  const merged = {};
  allKeys.forEach(k => { merged[k] = (ch[k] || 0) + (gr[k] || 0); });
  const keys = Object.keys(merged).filter(k => merged[k] !== 0 || k.includes('溢出'));
  if (keys.length > 0) {
    chgHtml = keys.map(k => {
      const v = merged[k];
      const isOverflow = k.includes('→');
      const cls = isOverflow ? '' : (v > 0 ? 'pos' : 'neg');
      const sign = v > 0 ? '+' : '';
      return `<div class="change-item ${cls}" style="${isOverflow ? 'color:var(--text2);border-left-color:var(--text2);' : ''}">${isOverflow ? '↪ ' + k : k + ' ' + sign + v}</div>`;
    }).join('');
  } else { chgHtml = '<div class="change-item">无变化</div>'; }

  // 结算面板只显4条，其余进新闻栏
  const allNews = data.world_news || [];
  const showNews = allNews.slice(0, 4);
  const newsHtml = showNews.map(n => `<div class="msg news">📰 ${n}</div>`).join('')
    + (allNews.length > 4 ? `<div style="text-align:center;font-size:12px;color:var(--text2);margin-top:4px;">共 ${allNews.length} 条新闻，点击 📰 新闻 查看全部</div>` : '');

  messages.push(`
    <div class="settle-panel">
      <div class="s-title">📋 回合结算</div>
      <div class="s-section"><h3>📖 剧情推进</h3><div class="s-text">${data.narrative}</div></div>

async function loadCareer(pid, ov) {
  try {
    const data = await api('GET', `/api/game/${pid}/career`);
    const records = data.career || [];
    if (records.length === 0) {
      ov.innerHTML = `<div class="modal-panel" style="max-width:650px;">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2>${data.player_name} · 生涯记录</h2>
        <div style="text-align:center;padding:40px;color:var(--text2);">生涯刚刚开始，暂无记录<br><br>完成第一个赛季后，这里会展示每年的数据</div>
      </div>`;
      return;
    }
    const totalGoals = records.reduce((s, r) => s + (r.goals || 0), 0);
    const totalApps = records.reduce((s, r) => s + (r.appearances || 0), 0);
    const totalAssists = records.reduce((s, r) => s + (r.assists || 0), 0);
    const summaryHtml = records.length > 0 ? `
      <div class="career-summary">
        <div class="cs-total">
          ${records.length}个赛季 · 共<b>${totalApps}</b>场 · <b>${totalGoals}</b>球 · <b>${totalAssists}</b>助
        </div>
      </div>` : '';

    const cardsHtml = records.slice().reverse().map(r => {
      const honorsHtml = (r.honors || []).length > 0
        ? `<div class="c-honors">${r.honors.map(h => {
            const isGold = /冠军|金靴|最佳|欧洲/.test(h);
            return `<span class="c-honor${isGold ? ' gold' : ''}">${h}</span>`;
          }).join('')}</div>`
        : '';
      const awardsHtml = (r.awards || []).length > 0
        ? `<div class="c-honors" style="margin-top:4px;">${r.awards.map(a => {
            const isTop = /金球|MVP|最佳阵容|金童/.test(a);
            return `<span class="c-honor${isTop ? ' gold' : ''}">🏅 ${a}</span>`;
          }).join('')}</div>`
        : '';
      const hlHtml = (r.highlights || []).length > 0
        ? `<details class="c-hl"><summary>赛季大事 (${r.highlights.length}条)</summary>${r.highlights.map(h => `<div>- ${h}</div>`).join('')}</details>`
        : '';
      return `
        <div class="career-card">
          <div class="c-head">
            <span class="c-season">第${r.season}赛季</span>
            <span style="color:var(--text2);font-size:13px;">${r.age}岁</span>
            <span class="c-club">${r.club}</span>
            <span style="color:var(--text2);font-size:13px;">联赛第${r.league_position}名</span>
          </div>
          <div class="c-stats">
            <div class="c-stat"><div class="n">${r.appearances}</div><div class="l">出场</div></div>
            <div class="c-stat"><div class="n" style="color:var(--green3);">${r.goals}</div><div class="l">进球</div></div>
            <div class="c-stat"><div class="n" style="color:var(--green3);">${r.assists}</div><div class="l">助攻</div></div>
          </div>
          ${honorsHtml}
          ${awardsHtml}
          ${hlHtml}
          <div class="c-attrs">硬实力 ${r.hard_sum || 0} | 软实力 ${r.soft_sum || 0}</div>
        </div>`;
    }).join('');

    ov.innerHTML = `<div class="modal-panel" style="max-width:650px;">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>${data.player_name} · 生涯记录</h2>
      ${summaryHtml}
      <div class="career-timeline">${cardsHtml}</div>
    </div>`;
  } catch (e) {
    ov.innerHTML = `<div class="modal-panel">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>生涯记录</h2>
      <div style="color:var(--red);text-align:center;padding:20px;">加载失败: ${e.message}</div>
    </div>`;
  }
}

const TRAIT_KEYS = Object.keys(TRAIT_INFO);
const POS_TRAITS = TRAIT_KEYS.filter(k => TRAIT_INFO[k].type === "positive");
const NEG_TRAITS = TRAIT_KEYS.filter(k => TRAIT_INFO[k].type === "negative");

function fillTraitDropdowns() {
  for (let i = 1; i <= 4; i++) {
    const el = $(`#c-trait${i}`);
    if (!el) continue;
    el.innerHTML = '<option value="">无特点</option>';
    [...POS_TRAITS, null, ...NEG_TRAITS].forEach(k => {
      if (k === null) { el.innerHTML += '<option disabled>── 负面特点 ──</option>'; return; }
      const info = TRAIT_INFO[k];
      const icon = info.type === 'negative' ? '🔴' : '🟢';
      el.innerHTML += `<option value="${k}">${icon} ${k}</option>`;
    });
    el.onchange = () => onTraitChange(i);
  }
}

function onTraitChange(which) {
  const sel = [];
  for (let i = 1; i <= 4; i++) {
    const v = $(`#c-trait${i}`)?.value;
    if (v) sel.push(v);
  }
  const posCount = sel.filter(t => TRAIT_INFO[t]?.type === "positive").length;
  const atPosLimit = posCount >= 2;
  for (let i = 1; i <= 4; i++) {
    const el = $(`#c-trait${i}`);
    if (!el) continue;
    const curVal = el.value;
    el.className = '';
    if (curVal && TRAIT_INFO[curVal]?.type === 'positive') el.className = 'has-pos';
    if (curVal && TRAIT_INFO[curVal]?.type === 'negative') el.className = 'has-neg';
    el.querySelectorAll('option').forEach(opt => {
      if (!opt.value) return;
      const isPos = TRAIT_INFO[opt.value]?.type === "positive";
      const alreadySelected = sel.includes(opt.value) && opt.value !== curVal;
      opt.disabled = alreadySelected || (isPos && atPosLimit && opt.value !== curVal);
    });
  }
  const uniq = [...new Set(sel)];
  $('#trait-desc').innerHTML = uniq.map(t => {
    const info = TRAIT_INFO[t];
    const icon = info?.type === "negative" ? "🔴" : "🟢";
    return `${icon} ${t}：${info?.desc || ""}`;
  }).join('<br>');
  $('#trait-warn').innerHTML = posCount > 2 ? '⚠ 正面特点最多2个' : '';
}

function getSelectedTraits() {
  const sel = [];
  for (let i = 1; i <= 4; i++) {
    const v = $(`#c-trait${i}`)?.value;
    if (v) sel.push(v);
  }
  return [...new Set(sel)];
}

// ======================== 回合开始 ========================
async function doRoundStart() {
  addSys('⏳ 新回合开始...');
  renderGame();
  try {
    const data = await api('POST', `/api/game/${pid}/round_start`);
    // refresh state
    state = await api('GET', `/api/game/${pid}/state`);
    state.news = data.news;
    pendingOffers = [];
    messages = [];
    addSys(`━━━ 第${data.season}赛季 · ${data.round_name} ━━━`);
    if (data.round_intro) addIntro(data.round_intro);
    (data.news || []).forEach(n => addNews(n));
    addSys('点击下方按钮获取事件 ↓');
    messages.push(`<div class="btn-row" id="first-event-btn">
      <button class="action-btn btn-primary" onclick="fetchNextEvent()">获取事件</button>
    </div>`);
    // 同步新闻到 state
    if (!state.news || state.news.length === 0) state.news = data.news;
    renderGame();
  } catch (e) {
    addSys('❌ ' + e.message);
    renderGame();
  }
}

// ======================== 获取下一个事件 ========================
async function fetchNextEvent() {
  // 移除旧事件卡片
  messages = messages.filter(m => !m.includes('evt-card'));
  const btnRow = messages.findIndex(m => m.includes('next-event-btn') || m.includes('settle-btn-row') || m.includes('first-event-btn'));
  if (btnRow >= 0) messages.splice(btnRow, 1);

  addSys('⏳ 生成事件...');
  renderGame();
  try {
    const data = await api('POST', `/api/game/${pid}/next_event`);
    messages = messages.filter(m => m !== '⏳ 生成事件...' && !m.includes('点击下方按钮获取事件'));
    addEventCard(data.event);
    addSys(`事件 ${data.events_done + 1} / ${data.events_total}`);
    renderGame();
  } catch (e) {
    messages = messages.filter(m => m !== '⏳ 生成事件...' && !m.includes('点击下方按钮获取事件'));
    addSys('❌ ' + e.message);
    renderGame();
  }
}

async function chooseOpt(optId) {

  messages.push(`<div class="msg ai" id="${phId}"></div>`);

  try {
    const result = await apiStream(
      `/api/game/${pid}/event_choice/stream`,
      { option_id: optId, custom_text: '' },
      (chunk) => { const el = document.getElementById(phId); if (el) { el.textContent += chunk; scrollDown(); } }
    );
    const idx = messages.findIndex(m => m.includes(phId));
    if (idx >= 0) messages[idx] = `<div class="msg ai">${result.narrative}</div>`;

      addSys(`📨 收到 ${result.transfer_offers.length} 份转会报价，点击顶栏报价按钮查看`);

    messages = messages.filter(m => !m.includes(phId));
    addSys('❌ ' + e.message); renderGame();

let negoChatLog = [];  // 谈判对话历史

async function doNegotiate(idx) {
  const msgEl = document.getElementById(`nego-msg-${idx}`);
  const msg = msgEl?.value?.trim();
  if (!msg) return;
  const logEl = document.getElementById(`nego-log-${idx}`);
  negoChatLog.push({role:'player', text:msg});
  if (logEl) {
    logEl.innerHTML += `<div style="color:var(--green3);margin:4px 0;">🧑 ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
  }
  msgEl.value = '';
  try {
    const res = await api('POST', `/api/game/${pid}/transfer/negotiate`, { content: msg, target: '' });
    if (logEl) {
      logEl.innerHTML += `<div style="color:var(--gold);margin:4px 0;">🏢 ${res.narrative}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }
    if (res.offer) {
      pendingOffers[idx] = res.offer;
      const o = res.offer;
      if (res.decision === 'reject') {
        pendingOffers.splice(idx, 1); closeModal(); addSys('谈判破裂，报价撤回'); renderGame(); return;
      }
      // 内联更新报价数字，不重建整个界面
      const wageEl = document.getElementById(`nego-wage-${idx}`);
      const yearEl = document.getElementById(`nego-year-${idx}`);
      const clEl = document.getElementById(`nego-clause-${idx}`);
      const yrSalary = document.getElementById(`nego-yrsalary-${idx}`);
      if (wageEl) wageEl.textContent = o.wage;
      if (yearEl) yearEl.textContent = o.years;
      if (clEl) clEl.textContent = o.clause > 0 ? o.clause + ' 万欧' : '无';
      if (yrSalary) yrSalary.textContent = Math.round(o.wage * 52);
    }
    if (res.round >= 4 && logEl) logEl.innerHTML += '<div style="color:var(--red);">已达最大谈判轮次</div>';
  } catch(e) { if (logEl) logEl.innerHTML += `<div style="color:var(--red);">失败: ${e.message}</div>`; }
}

async function rejectTransferOffer(idx) {

}

    messages.push(`<div class="btn-row" id="next-event-btn">

  } else {
    messages.push(`<div class="btn-row" id="settle-btn-row">
      <span style="color:var(--gold)">本回合事件已全部完成</span>

async function doSettle() {
  if (!confirm('确定结算当前回合吗？')) return;
  messages = messages.filter(m => !m.includes('next-event-btn') && !m.includes('settle-btn-row') && !m.includes('first-event-btn'));
  addSys('⏳ 结算中...');
  $('#settle-btn').disabled = true;
  renderGame();
  try {
    const data = await api('POST', `/api/game/${pid}/settle`);
    messages = messages.filter(m => m !== '⏳ 结算中...');
    addSettle(data);
    state = await api('GET', `/api/game/${pid}/state`);
    handleNewAchievements(data.new_achievements);
    renderGame();
  } catch (e) { addSys('❌ '+e.message); renderGame(); }
  $('#settle-btn').disabled = false;
}

// ======================== 渲染 ========================
function renderGame() {
  if (!state) return;
  const p = state.player; const s = state.season || {};
  render(`
    <div id="topbar">
      <div>
        <div class="title">⚽ 命运绿茵</div>
        <div class="info">${p.name}<span>|</span>${p.nationality}<span>|</span>${p.position}<span>|</span>${p.team_name}<span>|</span>世界${p.team_tier}<span>|</span>${p.locker_status||'普通成员'}<span>|</span>${p.height}cm ${p.weight}kg</div>
      </div>
      <div class="top-btns">
        <button class="top-btn" onclick="openModal('attrs')">📊 属性</button>
        <button class="top-btn" onclick="openModal('career')">🏆 生涯</button>
        <button class="top-btn" onclick="openAchievements()">🎖 成就</button>
        <button class="top-btn" onclick="openSaveModal()">💾 保存</button>
        <button class="top-btn" onclick="openModal('team')">🏟 球队</button>
        <button class="top-btn" onclick="openModal('news')">📰 新闻</button>
        ${pendingOffers.length > 0 ? '<button class="top-btn" style="color:var(--gold);border-color:var(--gold);" onclick="openTransferOffers()">📨 报价(' + pendingOffers.length + ')</button>' : ''}
        <button class="top-btn back-menu-btn" onclick="doBackToMenu()">🏠 菜单</button>
        <button class="top-btn back-menu-btn" onclick="resetAISetup()" style="margin-right:4px;">⚙</button>
      </div>
      <div style="font-size:11px;color:var(--text2);text-align:right;">第${s.season||'?'}赛季<br>${s.round_name||''}</div>
    </div>
    <div id="main-area">${renderMsgs()}</div>
    <div id="input-area">
      <button class="action-btn btn-gold" onclick="openTalkModal()" style="font-size:14px;">💬 自由对话</button>
      <button id="settle-btn" onclick="doSettle()">结算</button>
    </div>`);
  scrollDown();
}


// ======================== 存档选择 ========================
async function viewSaves() {
  pid = null; state = null; messages = []; currentEvent = null;

  let saves = [];
  try { const r = await api('GET', '/api/saves'); saves = r.saves || []; } catch (e) {}

  if (saves.length === 0) {
    viewCreate();
    return;
  }

  saves.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  const cards = saves.map(s => `
    <div class="save-card">
      <div class="s-avatar">${s.slot_name === '自动存档' ? '💾' : '📁'}</div>
      <div class="s-info">
        <div class="s-name">${s.slot_name}</div>
        <div class="s-meta">
          <b>${s.name}</b><span>|</span>${s.position}<span>|</span>${s.team_name}<span>|</span>
          第${s.season}赛季 · ${s.round_name}
        </div>
      </div>
      <div class="s-actions">
        <button class="save-btn cont" onclick="doContinue('${s.save_id}')">继续</button>
        <button class="save-btn del" onclick="doDeleteSave('${s.save_id}')">删除</button>
      </div>
    </div>`).join('');

  render(`
    <div class="save-list" style="padding-top:40px;">
      <h1>⚽ 命运绿茵</h1>
      <div class="sub">球员生涯模拟</div>
      ${cards}
      <button class="new-game-btn" onclick="viewCreate()">＋ 创建新角色</button>
    </div>`);
}

async function doContinue(saveId) {
  try {
    const data = await api('POST', `/api/saves/${saveId}/load`);
    pid = data.player.id;
    localStorage.setItem('fb_save', saveId);
    localStorage.setItem('fb_pid', pid);
    state = await api('GET', `/api/game/${pid}/state`);
    restoreGameState();
  } catch (e) {
    alert('加载失败: ' + e.message);
    viewSaves();
  }
}

// ---- 根据已保存状态恢复游戏界面 ----
function restoreGameState() {
  const s = state.season || {};
  messages = [];
  addSys(`欢迎回来，${state.player.name}`);
  addSys(`第${s.season}赛季 · ${s.round_name}`);

  const done = state.events_completed || 0;
  const evt = state.current_event;

  if (evt) {
    // 有待处理的事件卡片
    addEventCard(evt);
    addSys(`事件 ${done + 1} / 4`);
  } else if (done >= 4 || state.can_settle) {
    // 事件已完成，提示结算
    addSys('本回合事件已全部完成');
    messages.push(`<div class="btn-row" id="settle-btn-row">
      <span style="color:var(--gold)">本回合事件已全部完成</span>
      <button class="action-btn btn-gold" onclick="doSettle()">回合结算</button>
    </div>`);
  } else if (state.can_get_event) {
    // 新回合或事件可获取
    addSys('点击获取事件继续游戏 ↓');
    messages.push(`<div class="btn-row" id="first-event-btn">
      <button class="action-btn btn-primary" onclick="fetchNextEvent()">获取事件</button>
      ${done > 0 ? `<button class="action-btn btn-gold" onclick="doSettle()">回合结算</button>` : ''}
    </div>`);
  }

  renderGame();
}

async function doDeleteSave(saveId) {
  if (!confirm('确定删除这个存档吗？此操作不可恢复。')) return;
  try { await api('DELETE', `/api/saves/${saveId}`); } catch (e) { alert('删除失败: ' + e.message); }
  if (saveId === localStorage.getItem('fb_save')) {
    localStorage.removeItem('fb_save'); localStorage.removeItem('fb_pid');
  }
  viewSaves();
}

async function expandNewsItem(p, i, headline) {
  const li = document.getElementById('news-' + i);
  const detail = document.getElementById('news-detail-' + i);
  if (!li || !detail) return;
  if (li.classList.contains('open')) { li.classList.remove('open'); return; }
  li.classList.add('open');
  if (detail.dataset.loaded === '1') return;
  try {
    const res = await api('POST', '/api/game/' + p + '/news/expand', { content: headline, target: '' });
    detail.textContent = res.detail;
    detail.dataset.loaded = '1';
  } catch(e) {
    detail.textContent = '详情加载失败';
  }
}

// ---- 成就系统 ----
function showAchievementBanner(ach) {
  const b = document.createElement('div');
  b.className = 'ach-banner';
  b.innerHTML = `<span class="ach-icon">${ach.icon}</span><div class="ach-text">🏆 成就解锁！<b>${ach.name}</b><small>${ach.desc}</small></div>`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 4000);
}

async function openAchievements() {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'modal-overlay';
  ov.onclick = e => { if (e.target === ov) closeModal(); };
  ov.innerHTML = `<div class="modal-panel" style="max-width:700px;">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>🏆 成就</h2>
    <div style="text-align:center;padding:40px;"><span class="loading"></span> 加载中...</div>
  </div>`;
  document.body.appendChild(ov);

  try {
    const data = await api('GET', `/api/game/${pid}/achievements`);
    const all = data.achievements || [];
    const cats = ['里程碑','荣誉','事件','巅峰','更衣室','合同','转会','特点'];
    const unlocked = all.filter(a => a.unlocked).length;
    const total = all.length;

    const html = cats.map(cat => {
      const items = all.filter(a => a.cat === cat);
      const u = items.filter(a => a.unlocked).length;
      const itemsHtml = items.map(a => `
        <div class="ach-item ${a.unlocked ? 'unlocked' : 'locked'}">
          <span class="ach-icon">${a.icon}</span>
          <div class="ach-info">
            <div class="ach-name">${a.name}</div>
            <div class="ach-desc">${a.unlocked ? `第${a.season}赛季 ${a.round} 解锁` : a.desc}</div>
          </div>
        </div>`).join('');
      return `<div class="ach-cat"><h3>${cat} <span class="ach-count">${u}/${items.length}</span></h3><div class="ach-grid">${itemsHtml}</div></div>`;
    }).join('');

    ov.innerHTML = `<div class="modal-panel" style="max-width:700px;">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>🏆 成就 <span style="font-size:14px;color:var(--text2);font-weight:400;">${unlocked}/${total}</span></h2>
      ${html}
    </div>`;
  } catch (e) {
    ov.innerHTML = `<div class="modal-panel"><button class="modal-close" onclick="closeModal()">✕</button><h2>成就</h2><div style="color:var(--red);padding:20px;">加载失败</div></div>`;
  }
}

function handleNewAchievements(list) {
  if (!list || list.length === 0) return;
  list.forEach(a => setTimeout(() => showAchievementBanner(a), list.indexOf(a) * 500));
}

function doBackToMenu() {
  if (!confirm('返回主菜单？\n当前进度已自动保存，下次可从存档列表继续。')) return;
  viewSaves();
}

// ---- 手动命名存档 ----
function openSaveModal() {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'modal-overlay';
  ov.onclick = e => { if (e.target === ov) closeModal(); };
  ov.innerHTML = `<div class="modal-panel talk-modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>💾 保存游戏</h2>
    <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:6px;">存档名称</label>
    <input id="save-name" class="talk-msg-input" style="min-height:auto;height:44px;" placeholder="例：欧冠决赛前" value="">
    <button class="talk-send-btn" onclick="doManualSave()" style="margin-top:8px;">保 存</button>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(() => document.getElementById('save-name')?.focus(), 200);
}

async function doManualSave() {
  const name = document.getElementById('save-name')?.value?.trim() || '手动存档';
  const btn = document.querySelector('.talk-send-btn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    const data = await api('POST', `/api/game/${pid}/save`, { content: name });
    closeModal();
    addSys(`💾 存档「${name}」已保存`);
    renderGame();
  } catch (e) {
    alert('保存失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '保 存'; }
  }
}

// ======================== AI 设置 ========================
async function checkAISetup() {
  try { const r = await api('GET', '/api/config'); return r.ai_ready; } catch(e) { return false; }
}

function showSetup() {
  render(`
    <div class="save-list" style="padding-top:30px;">
      <h1 style="font-size:28px;">⚽ 命运绿茵</h1>
      <div class="sub" style="margin-bottom:20px;">首次使用请配置 AI 接口</div>
      <div class="fg"><label>API Key（必填）</label><input id="setup-key" placeholder="sk-..." value=""></div>
      <div class="fg"><label>API 地址</label><input id="setup-url" placeholder="https://api.deepseek.com" value=""></div>
      <div class="fg"><label>模型名称</label><input id="setup-model" placeholder="deepseek-chat" value=""></div>
      <button id="create-btn" onclick="doSetup()" style="margin-top:12px;">保 存 并 测 试</button>
      <div id="setup-msg" style="text-align:center;margin-top:10px;font-size:13px;color:var(--text2);"></div>
    </div>
  `);
}

async function resetAISetup() {
  localStorage.removeItem('fb_ai_setup');
  await api('POST', '/api/setup', { api_key: '', base_url: '', model: '' });
  location.reload();
}

async function doSetup() {
  const btn = $('#create-btn'); btn.disabled = true; btn.innerHTML = '<span class="loading"></span>测试中...';
  const msg = $('#setup-msg');
  try {
    await api('POST', '/api/setup', {
      api_key: $('#setup-key').value.trim(),
      base_url: $('#setup-url').value.trim(),
      model: $('#setup-model').value.trim(),
    });
    localStorage.setItem('fb_ai_setup', JSON.stringify({
      api_key: $('#setup-key').value.trim(),
      base_url: $('#setup-url').value.trim(),
      model: $('#setup-model').value.trim(),
    }));
    msg.innerHTML = '✅ 配置成功！加载中...';
    setTimeout(() => init(), 500);
  } catch(e) {
    msg.innerHTML = '❌ 连接失败: ' + e.message;
    btn.disabled = false; btn.innerHTML = '保 存 并 测 试';
  }
}

// ======================== 初始化 ========================
async function init() {
  // 检查 AI 配置
  const ready = await checkAISetup();
  if (!ready) {
    const saved = localStorage.getItem('fb_ai_setup');
    if (saved) {
      try {
        await api('POST', '/api/setup', JSON.parse(saved));
        if (!(await checkAISetup())) { showSetup(); return; }
      } catch(e) { showSetup(); return; }
    } else { showSetup(); return; }
  }

  let saves = [];
  try { const r = await api('GET', '/api/saves'); saves = r.saves || []; } catch (e) {}

  // 优先用 save_id，回退到 player_id 查找
  const savedSave = localStorage.getItem('fb_save');
  const savedPid = localStorage.getItem('fb_pid');
  const match = (savedSave && saves.find(s => s.save_id === savedSave))
             || (savedPid && saves.find(s => s.player_id === savedPid && s.slot_name === '自动存档'));

  if (match) {
    try {
      const data = await api('POST', `/api/saves/${match.save_id}/load`);
      pid = data.player.id;
      localStorage.setItem('fb_save', match.save_id);
      localStorage.setItem('fb_pid', pid);
      state = await api('GET', `/api/game/${pid}/state`);
      restoreGameState();
      return;
    } catch (e) { localStorage.removeItem('fb_save'); localStorage.removeItem('fb_pid'); }
  }

  if (saves.length > 0) { viewSaves(); } else { viewCreate(); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init();

</script>
